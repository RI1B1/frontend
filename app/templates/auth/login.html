```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AnterinDong</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/login.css') }}">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">A</div>
                <h2>Anterin<span>Dong.</span></h2>
            </div>

            <div class="welcome">
                <p class="eyebrow">UGM MOBILITY PLATFORM</p>
                <h1>Selamat Datang!</h1>
                <p>Masuk untuk mulai menggunakan layanan AnterinDong.</p>
            </div>

            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="email">Email UGM</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@mail.ugm.ac.id"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Lihat
                        </button>
                    </div>
                </div>

                <div class="error-message" id="errorMessage">
                    <!-- Pesan error dari backend ditampilkan di sini -->
                </div>

                <button type="submit" class="login-button">
                    Masuk Sekarang
                </button>

            </form>

            <div class="register">
                Belum punya akun?
                <a href="/register">Daftar sekarang</a>
            </div>

            <div class="footer">
                AnterinDong © 2026
                <br>
                Made for UGM Community
            </div>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Sembunyikan";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Lihat";
            }

        });
    </script>

</body>
</html>
```
