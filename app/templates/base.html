<html lang="id">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">

      <a class="brand" href="/">{{ app_name }}</a>

  </body>
</html>
